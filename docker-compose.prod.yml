# The v1 app on the Jakarta VPS (ADR 0002): own Postgres, own network, resource
# limits per service.
#
# NOT production-only, despite the filename. This one file runs every host
# environment, and the env file decides which one:
#
#   project        env file                          APP_ENV     site
#   makam-staging  /opt/makam-v1/staging/staging.env  staging     dev.makam.co.id (ticket 07, live)
#   makam-prod     /opt/makam-v1/prod/prod.env        production  makam.co.id (ticket 65)
#
# Nothing here defaults to production. MAKAM_PROJECT, MAKAM_APP_ENV,
# MAKAM_ENV_FILE, MAKAM_WEB_PORT and MAKAM_TAG have no default, so a command
# without the env files fails instead of silently becoming makam-prod. The
# host deploy script (deploy/bin/makam-deploy, see docs/ops/runbook.md) does
#
#   docker pull ghcr.io/andrianm28/makam:sha-<commit>
#   docker compose -p makam-staging -f compose.yml --env-file staging.env --env-file deployed.env run --rm migrate
#                                            # must succeed, or nothing restarts
#   docker compose ... up -d --wait
#
# The env file (on the host only, mode 0600, never committed) supplies both the
# interpolation variables below and, through MAKAM_ENV_FILE, the app's runtime
# env: MAKAM_PROJECT, MAKAM_APP_ENV, MAKAM_ENV_FILE, MAKAM_WEB_PORT,
# POSTGRES_PASSWORD, DATABASE_URL, AUTH_SECRET, TOTP_ENCRYPTION_KEY, VAPID_PUBLIC_KEY,
# VAPID_PRIVATE_KEY, VAPID_SUBJECT, APP_BASE_URL
# (https://dev.makam.co.id / https://makam.co.id), SENTRY_DSN, ...
# deployed.env (written by the deploy script) supplies MAKAM_TAG and MAKAM_RELEASE.
name: ${MAKAM_PROJECT:?set MAKAM_PROJECT (makam-staging or makam-prod) in the env file}

x-app: &app
  # MAKAM_TAG is set by the deploy script (sha-<commit>), so a deploy and a
  # rollback both name an exact image.
  image: ${MAKAM_IMAGE:-ghcr.io/andrianm28/makam}:${MAKAM_TAG:?set MAKAM_TAG (deployed.env, or makam-deploy --tag)}
  env_file: ${MAKAM_ENV_FILE:?set MAKAM_ENV_FILE}
  environment:
    APP_ENV: ${MAKAM_APP_ENV:?set MAKAM_APP_ENV}
    SENTRY_RELEASE: ${MAKAM_RELEASE:-}
    TZ: Asia/Jakarta
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    # PostgreSQL 18.6 (Debian 18.6-1.pgdg13+2), the image running since 2026-09-25.
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    environment:
      POSTGRES_USER: makam
      POSTGRES_DB: makam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makam -d makam"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    <<: *app
    command: ["node", "dist/migrate.mjs"]
    restart: "no"
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  web:
    <<: *app
    command: ["node", "server.js"]
    ports:
      # Behind the host's reverse proxy; never exposed directly.
      - "127.0.0.1:${MAKAM_WEB_PORT:?set MAKAM_WEB_PORT}:3000"
    networks: [default, glitchtip]
    volumes:
      # The FileStore (ticket 60, ADR 0002 beta UAT amendment): private,
      # makam-only, never mounted into nginx or any other service. Files leave
      # only through the app's own short-lived signed URLs
      # (/api/files/[...key]), never a bind mount or a static route.
      - files:/data/files
    # Liveness only: any HTTP answer from /api/health counts (it is 503 until
    # the worker's first heartbeat). `up --wait` waits for this.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(()=>process.exit(0),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g

  worker:
    <<: *app
    command: ["node", "dist/worker.mjs"]
    networks: [default, glitchtip]
    volumes:
      - files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

networks:
  default:
  # Server-side error events go straight to the GlitchTip compose project on
  # this host (SENTRY_DSN=http://<key>@glitchtip-web:8000/<id>), not through
  # nginx. The network belongs to the `glitchtip` project
  # (deploy/glitchtip/compose.yml); start that first.
  glitchtip:
    external: true
    name: glitchtip_ingest

volumes:
  pgdata:
  # The private FileStore (ticket 60): backed up nightly by
  # deploy/bin/makam-backup-files, kept 7 days on the host alongside the
  # database's own nightly dump (ticket 64, beta scope).
  files:
