# Proxy settings shared by every location of makam.co.id that reaches
# makam-prod web. Installed at /etc/nginx/snippets/makam-prod-proxy.conf
# by makam-switch; included from deploy/nginx/makam.co.id.conf. It uses
# $makam_connection_upgrade, defined in dev.makam.co.id.conf.
proxy_pass         http://127.0.0.1:3100;
proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   Upgrade           $http_upgrade;
proxy_set_header   Connection        $makam_connection_upgrade;
