# dev.makam.co.id: makam.co.id v1 staging (compose project makam-staging).
#
# Installed at /etc/nginx/sites-available/dev.makam.co.id.conf (ticket 07,
# approved 2026-09-25). It replaced the old Laravel app's dev block
# (proxy to 127.0.0.1:8081); that block is backed up verbatim under
# /opt/makam-v1/nginx-backups/, and the rollback is in docs/ops/runbook.md.
# The old dev containers (makam-nonprod-dev-*) still run on 8081.
#
# Staging is public (no basic auth since 2026-09-25, user decision); X-Robots-Tag keeps it unindexed.
# (mode 0600); hash in /etc/nginx/makam-staging.htpasswd (root:www-data 0640).
# Open without auth, each an exact path: the ACME challenge, /api/health
# (uptime monitor), and /api/webhooks/pembayaran (SumoPod sandbox cannot send
# basic auth; the route verifies the Svix signature itself).
#
# The proxy lines live in /etc/nginx/snippets/makam-staging-proxy.conf (source:
# deploy/nginx/makam-staging-proxy.conf); install both together.

# WebSocket upgrade only when the client asks for one. Namespaced (not the
# usual $connection_upgrade) because other sites share this nginx's http block
# and a second map of the same variable would fail `nginx -t`.
map $http_upgrade $makam_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.makam.co.id;

    # ACME HTTP-01 challenge for Certbot renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.makam.co.id;

    # Certbot-managed certificate (unchanged from the previous block).
    ssl_certificate     /etc/letsencrypt/live/dev.makam.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.makam.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Never indexed; `always` so the header survives 4xx and 5xx too.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # No HSTS on this host: a non-production subdomain must not pin the
    # browser for the whole makam.co.id domain.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "no-referrer" always;

    access_log /var/log/nginx/dev.makam.co.id.access.log;
    error_log  /var/log/nginx/dev.makam.co.id.error.log warn;

    client_max_body_size 12m;

    # No basic auth: staging is public (user decision 2026-09-25). X-Robots-Tag
    # keeps it out of search engines.

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Uptime monitor: JSON with ok / database.ok / worker heartbeat age only.
    location = /api/health {
        include snippets/makam-staging-proxy.conf;
        proxy_read_timeout 30s;
    }

    # SumoPod (sandbox) payment webhooks; authenticated by their Svix signature.
    location = /api/webhooks/pembayaran {
        include snippets/makam-staging-proxy.conf;
        proxy_read_timeout 60s;
    }

    # Everything else. Being a plain prefix location, it lets the dotfile regex
    # below win (/.env, /.git/...): only the ^~ ACME location skips that regex.
    location / {
        include snippets/makam-staging-proxy.conf;
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
