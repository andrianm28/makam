# dev.makam.co.id: makam.co.id v1 staging (compose project makam-staging).
#
# Installed at /etc/nginx/sites-available/dev.makam.co.id.conf (ticket 07,
# approved 2026-09-25). It replaced the old Laravel app's dev block
# (proxy to 127.0.0.1:8081); that block is backed up verbatim under
# /opt/makam-v1/nginx-backups/, and the rollback is in docs/ops/runbook.md.
# The old dev containers (makam-nonprod-dev-*) still run on 8081.
#
# Staging is behind HTTP basic auth. Credentials: /opt/makam-v1/staging-basic-auth.txt
# (mode 0600); hash in /etc/nginx/makam-staging.htpasswd (root:www-data 0640).
# Open without auth: the ACME challenge, /api/health (uptime monitor), and
# /api/webhooks/sumopod (SumoPod sandbox cannot send basic auth; the route
# verifies the Svix signature itself).

server {
    listen 80;
    listen [::]:80;
    server_name dev.makam.co.id;

    # ACME HTTP-01 must bypass basic auth or certificate renewal fails with 401.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.makam.co.id;

    # Certbot-managed certificate (unchanged from the previous block).
    ssl_certificate     /etc/letsencrypt/live/dev.makam.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.makam.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Never indexed; `always` so the header survives 4xx and 5xx too.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # No HSTS on this host: a non-production subdomain must not pin the
    # browser for the whole makam.co.id domain.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "no-referrer" always;

    access_log /var/log/nginx/dev.makam.co.id.access.log;
    error_log  /var/log/nginx/dev.makam.co.id.error.log warn;

    client_max_body_size 12m;

    auth_basic           "makam staging";
    auth_basic_user_file /etc/nginx/makam-staging.htpasswd;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Uptime monitor: JSON with ok / database.ok / worker heartbeat age only.
    location = /api/health {
        auth_basic off;
        proxy_pass         http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SumoPod (sandbox) payment webhooks; authenticated by their Svix signature.
    location ^~ /api/webhooks/sumopod {
        auth_basic off;
        proxy_pass         http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
