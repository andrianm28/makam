# Proxy settings shared by every location of dev.makam.co.id that reaches
# makam-staging web. Installed at /etc/nginx/snippets/makam-staging-proxy.conf
# by deploy/install-host.sh; included from deploy/nginx/dev.makam.co.id.conf,
# which also defines $makam_connection_upgrade.
proxy_pass         http://127.0.0.1:3110;
proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   Upgrade           $http_upgrade;
proxy_set_header   Connection        $makam_connection_upgrade;
