# errors.makam.co.id: self-hosted GlitchTip (compose project `glitchtip`).
#
# Installed at /etc/nginx/sites-available/errors.makam.co.id.conf but NOT
# enabled until the DNS A record errors.makam.co.id -> 103.92.214.243 exists
# (ticket 02). Then, in order (docs/ops/runbook.md, "errors.makam.co.id"):
#
#   sudo ln -s /etc/nginx/sites-available/errors.makam.co.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d errors.makam.co.id --non-interactive --agree-tos --redirect
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certbot adds the 443 server, the certificate lines and the 80 -> 443 redirect.
# GlitchTip has its own login; no basic auth (browsers must reach the ingest
# endpoints with the public DSN).

server {
    listen 80;
    listen [::]:80;
    server_name errors.makam.co.id;

    access_log /var/log/nginx/errors.makam.co.id.access.log;
    error_log  /var/log/nginx/errors.makam.co.id.error.log warn;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # GlitchTip's recommendation for event and sourcemap uploads.
    client_max_body_size 40m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass         http://127.0.0.1:8130;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
