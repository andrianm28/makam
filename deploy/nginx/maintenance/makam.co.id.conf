# makam.co.id and www: the switch-day fallback, a static maintenance page
# (ticket 65, owner decision 2026-10-03). Installed by
# `makam-switch --ke pemeliharaan` in place of deploy/nginx/makam.co.id.conf.
#
# Every path answers 503 with Retry-After and the page below, so search engines
# and SumoPod retry later rather than index an outage. /api/health answers 503
# JSON so the uptime alarm sees it. The page is installed at
# /var/www/makam-maintenance/index.html by makam-switch; it has no external
# assets. Same certificate as the production block.
#
# Not 503, on purpose: the ACME challenge path (Certbot renewals keep working
# during the fallback) and all of port 80, which redirects to https first (an
# ACME challenge on port 80 is still answered).

server {
    listen 80;
    listen [::]:80;
    server_name makam.co.id www.makam.co.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name makam.co.id www.makam.co.id;

    ssl_certificate     /etc/letsencrypt/live/makam.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/makam.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "no-referrer" always;

    access_log /var/log/nginx/makam.co.id.access.log;
    error_log  /var/log/nginx/makam.co.id.error.log warn;

    error_page 503 @pemeliharaan;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location = /api/health {
        default_type application/json;
        add_header Retry-After "3600" always;
        return 503 '{"ok":false,"pemeliharaan":true}';
    }

    location / {
        return 503;
    }

    location @pemeliharaan {
        root /var/www/makam-maintenance;
        rewrite ^ /index.html break;
        # add_header in a location replaces the server-level ones, so the
        # security headers are repeated here.
        add_header Retry-After "3600" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "no-referrer" always;
    }
}
