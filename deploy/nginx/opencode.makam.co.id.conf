# opencode.makam.co.id: OpenCode documentation (static Astro/Starlight site)
#
# Installed at /etc/nginx/sites-available/opencode.makam.co.id.conf
# Static files served from /var/www/opencode-docs

server {
    listen 80;
    listen [::]:80;
    server_name opencode.makam.co.id;

    # ACME HTTP-01 challenge for Certbot renewals
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name opencode.makam.co.id;

    # Certbot-managed certificate
    ssl_certificate     /etc/letsencrypt/live/opencode.makam.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opencode.makam.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Robots-Tag "index, follow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/opencode.makam.co.id.access.log;
    error_log  /var/log/nginx/opencode.makam.co.id.error.log warn;

    client_max_body_size 10m;

    # Static files
    root /var/www/opencode-docs;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # SPA routing: try file, then directory index, then fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}