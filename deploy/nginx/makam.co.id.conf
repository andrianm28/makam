# makam.co.id and www.makam.co.id: makam.co.id v1 production (compose project
# makam-prod, web on 127.0.0.1:3100). Ticket 65.
#
# Installed by `makam-switch --ke v1` (deploy/bin/makam-switch) over the old
# app's block, which it first backs up verbatim with a timestamp under
# /opt/makam-v1/nginx-backups/. The switch-day fallback is the maintenance block
# beside this one (deploy/nginx/maintenance/): `makam-switch --ke pemeliharaan`.
# docs/ops/runbook.md, "Hari switch", has the order of the day.
#
# Same headers, body size and timeouts as the staging block
# (dev.makam.co.id.conf), except that production is indexable (no noindex header)
# and sets HSTS for this host in steps: one day at the switch, raised to a year
# after two stable weeks (runbook, "Hari switch"). The proxy lines live in
# /etc/nginx/snippets/makam-prod-proxy.conf (source:
# deploy/nginx/makam-prod-proxy.conf), installed with this file by
# `makam-switch`; they use $makam_connection_upgrade, the map that
# dev.makam.co.id.conf defines (a second map of the same variable would fail
# `nginx -t`), so that file stays installed.
#
# Nothing here asks for authentication. The payment webhook
# /api/webhooks/pembayaran must be reachable by SumoPod; the route verifies the
# Svix signature itself. /api/health is the uptime monitor's.

server {
    listen 80;
    listen [::]:80;
    server_name makam.co.id www.makam.co.id;

    # ACME HTTP-01 challenge for Certbot renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name makam.co.id www.makam.co.id;

    # The Certbot certificate that the old block already uses: unchanged.
    ssl_certificate     /etc/letsencrypt/live/makam.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/makam.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "no-referrer" always;

    access_log /var/log/nginx/makam.co.id.access.log;
    error_log  /var/log/nginx/makam.co.id.error.log warn;

    client_max_body_size 12m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Uptime monitor: JSON with ok / database.ok / worker heartbeat age only.
    location = /api/health {
        include snippets/makam-prod-proxy.conf;
        proxy_read_timeout 30s;
    }

    # SumoPod payment webhooks; authenticated by their Svix signature.
    location = /api/webhooks/pembayaran {
        include snippets/makam-prod-proxy.conf;
        proxy_read_timeout 60s;
    }

    location / {
        include snippets/makam-prod-proxy.conf;
        proxy_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
