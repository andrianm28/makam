name: Smoke test staging

# The gate in front of production (ticket 72): a short Playwright smoke test
# against the real https://dev.makam.co.id, on a hosted runner, never on the
# host. It runs for the digest staging is actually running and records the
# result against that digest as a GitHub Deployment status, which
# "Promosikan ke produksi" reads before it will promote anything.
#
# Scheduled every 15 minutes, so a digest staging picks up between manual runs
# is still covered; the owner can also start it by hand after a rollback.
on:
  workflow_dispatch:
  # A staging deployment that just succeeded is smoked at once; the schedule
  # and the manual start stay as they were.
  deployment_status:
  schedule:
    - cron: "*/15 * * * *"

permissions: {}

concurrency:
  group: staging-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Playwright smoke against dev.makam.co.id
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      BASE_URL: https://dev.makam.co.id
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # What staging is running right now, by digest: the newest staging
      # deployment that names one. A host that never deployed has no digest, and
      # then there is nothing to smoke.
      - name: The digest staging is running
        id: running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=staging&per_page=10" \
            --jq '[.[] | select(.payload.image_digest != null)] | .[0] | select(. != null) | "\(.payload.image_digest) \(.ref)"' > "$RUNNER_TEMP/running"
          read -r digest ref < "$RUNNER_TEMP/running" || true
          if [ -z "${digest:-}" ]; then
            echo "Staging has no recorded deployment; nothing to smoke" >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "found=true"
            echo "digest=$digest"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
          echo "Staging is running $digest (release $ref)"
      # The digest says what the host pulled; /api/health says what is really
      # answering. A different release means the deploy did not take, so the
      # digest must not be promoted: the result is recorded as failure below.
      - name: Staging runs the release the Deployment names
        id: release
        if: steps.running.outputs.found == 'true'
        env:
          REF: ${{ steps.running.outputs.ref }}
        run: |
          body=$(curl -sS --retry 3 --retry-delay 5 --retry-all-errors "$BASE_URL/api/health" || true)
          release=$(printf '%s' "$body" | jq -r '.release // empty' 2>/dev/null || true)
          if [ -n "$release" ] && [ "$release" = "$REF" ]; then
            echo "release_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Staging runs release '${release:-none}' but the Deployment names '$REF'"
            echo "Staging runs release '${release:-none}' but the Deployment names '$REF'" >&2
            echo "release_ok=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.running.outputs.found == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.running.outputs.found == 'true'
      - name: Playwright version
        id: playwright
        if: steps.running.outputs.found == 'true'
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        if: steps.running.outputs.found == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.running.outputs.found == 'true' && steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # Three pages, no login: health, the public home and Masuk. Anything that
      # needs a seeded Admin Platform belongs in the e2e job, not here.
      - name: Health, home and the Masuk page
        if: steps.running.outputs.found == 'true'
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.BASE_URL }}
        run: npx playwright test e2e/smoke.spec.ts
      - name: Upload traces and screenshots
        if: failure() && steps.running.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-smoke-results
          path: test-results/
          retention-days: 14
      # The result is recorded as a status on the very deployment the host made
      # for that digest, so "Promosikan ke produksi" can look for exactly this
      # status and nothing else.
      - name: Record the result against the digest
        if: always() && steps.running.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.running.outputs.digest }}
          RESULT: ${{ job.status }}
          RELEASE_OK: ${{ steps.release.outputs.release_ok }}
        run: |
          if [ "$RESULT" = success ] && [ "$RELEASE_OK" = true ]; then state=success; else state=failure; fi
          id=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=staging&per_page=20" \
            --jq "[.[] | select(.payload.image_digest == \"$DIGEST\")] | .[0].id // empty")
          if [ -z "$id" ]; then
            echo "No staging deployment records $DIGEST; recording the smoke result as a comment instead" >&2
            gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments" \
              -f ref="$GITHUB_SHA" -F environment=staging -F auto_merge=false \
              -F "payload={\"image_digest\":\"$DIGEST\"}" --jq '.id' > "$RUNNER_TEMP/deployment"
            id=$(cat "$RUNNER_TEMP/deployment")
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/$id/statuses" \
            -f state="$state" -f environment=staging \
            -f "log_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f "description=smoke test against dev.makam.co.id for $DIGEST: $state"
