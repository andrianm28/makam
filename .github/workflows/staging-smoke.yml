name: Smoke test staging

# The gate in front of production (ticket 72): a short Playwright smoke test
# against the real https://dev.makam.co.id, on a hosted runner, never on the
# host. It runs for the digest staging is actually running and records the
# result against that digest as a GitHub Deployment status, which
# "Promosikan ke produksi" reads before it will promote anything.
#
# It runs when the host reports a staging deploy healthy (a `success` status on
# its Deployment), so a deploy is smoked within minutes; and every 15 minutes,
# so a digest staging picks up between those is still covered; the owner can
# also start it by hand after a rollback.
#
# A pass is recorded only when the site answers as the digest the status names:
# /api/health reports the commit it runs (`release`), and a site that runs
# another commit than the Deployment's ref (a deploy that failed and rolled
# back, whose Deployment is still the newest) records a failure, whatever the
# pages looked like (ticket 106).
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  deployment_status:

permissions: {}

# `bash -eo pipefail` for every script, so a failing curl or gh at the head of a
# pipe is not read as an empty answer.
defaults:
  run:
    shell: bash

concurrency:
  group: staging-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Playwright smoke against dev.makam.co.id
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A deployment_status event fires for every status of every Deployment, the
    # smoke test's own included. Only a staging Deployment that just came up
    # healthy (the host's success status) is worth a run, and never one this
    # workflow recorded itself.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'staging' &&
      !startsWith(github.event.deployment_status.description, 'smoke test '))
    permissions:
      contents: read
      deployments: write
    env:
      BASE_URL: https://dev.makam.co.id
    steps:
      # What staging is running right now: the newest staging deployment that
      # names a digest, with its id and the commit it was made for. A host that
      # never deployed has no digest, and then there is nothing to smoke.
      - name: The digest staging is running
        id: running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          deployment=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=staging&per_page=10" \
            | jq -c 'def digest: (.payload | if type == "string" then (try fromjson catch null) else . end) | objects | .image_digest;
                     [.[] | {id, ref, digest: digest} | select(.digest != null)] | .[0] // empty')
          if [ -z "$deployment" ]; then
            echo "Staging has no recorded deployment; nothing to smoke" >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          digest=$(jq -r '.digest' <<< "$deployment")
          ref=$(jq -r '.ref' <<< "$deployment")
          id=$(jq -r '.id' <<< "$deployment")
          {
            echo "found=true"
            echo "id=$id"
            echo "digest=$digest"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
          echo "Staging is running $digest (deployment $id, commit $ref)"
      # The code of what staging runs, not the default branch's tip and not
      # whatever ref the triggering event carries (a deployment_status event for
      # a Deployment made from a bare SHA has no branch to name): the smoke test
      # then judges the deployed commit by its own spec.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.running.outputs.found == 'true'
        with:
          ref: ${{ steps.running.outputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.running.outputs.found == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.running.outputs.found == 'true'
      - name: Playwright version
        id: playwright
        if: steps.running.outputs.found == 'true'
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        if: steps.running.outputs.found == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.running.outputs.found == 'true' && steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # Three pages, no login: health, the public home and Masuk. Anything that
      # needs a seeded Admin Platform belongs in the e2e job, not here.
      - name: Health, home and the Masuk page
        if: steps.running.outputs.found == 'true'
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.BASE_URL }}
        run: npx playwright test e2e/smoke.spec.ts
      - name: Upload traces and screenshots
        if: failure() && steps.running.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-smoke-results
          path: test-results/
          retention-days: 14
      # The result is recorded as a status on the very deployment the host made
      # for that digest, so "Promosikan ke produksi" can look for exactly this
      # status and nothing else. Playwright passing says the site is up; this
      # step also asks which commit the site runs, and records a pass only when
      # it is the one the deployment was made for.
      - name: Record the result against the digest
        if: always() && steps.running.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEPLOYMENT_ID: ${{ steps.running.outputs.id }}
          DIGEST: ${{ steps.running.outputs.digest }}
          REF: ${{ steps.running.outputs.ref }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          note="the Playwright smoke test did not pass"
          if [ "$RESULT" = success ]; then
            # The body is read whatever the status code: an unhealthy site answers
            # 503 with the same JSON. A site that cannot be asked, or an image
            # with no release in its health report, is not the digest we know.
            running=$(curl -sS -m 15 "$BASE_URL/api/health" | jq -r '.release // empty') || running=""
            if [ "$running" = "$REF" ]; then
              state=success
              note=""
            else
              note="$BASE_URL runs release \"${running:-unknown}\", not $REF, the commit this deployment was made for"
            fi
          fi
          [ -z "$note" ] || echo "$note" >&2
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state="$state" -f environment=staging \
            -f "log_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f "description=smoke test against dev.makam.co.id for $DIGEST: $state"
