name: Promosikan ke produksi

# Owner-only promotion of a staging digest to production (ticket 72, ADR 0002).
# Nothing here runs on a schedule and nothing here runs itself: the owner starts
# it, types the release tag a second time, and the workflow still refuses unless
# the digest is the one staging is running and its smoke test passed.
#
# The production host accepts only images signed with the PRODUCTION key, so
# re-signing here is what makes the digest promotable. A staging-signed digest
# alone never reaches makam.co.id.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "The release tag to create, typed again: vYYYY.MM.DD-N"
        required: true
        type: string
      reason:
        description: "Why this is going out (goes into the release notes)"
        required: true
        type: string

permissions: {}

# Never cancelled mid-way: a half-signed or half-tagged release is worse than a
# slow one.
concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  check:
    name: Owner, tag and digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    outputs:
      digest: ${{ steps.verified.outputs.digest }}
      sha: ${{ steps.verified.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Only the repository owner may promote
        if: github.actor != github.repository_owner
        env:
          ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "refusing: $ACTOR is not the owner of $GH_REPO" >&2
          exit 1
      - name: The release tag, typed again
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          today=$(TZ=Asia/Jakarta date +%Y.%m.%d)
          # N counts the published v releases published today in WIB (publishedAt is
          # UTC, so add 7 hours before taking the date). A draft left by a failed
          # run does not count: re-running with the same tag completes it.
          count=$(gh release list --limit 200 --json tagName,publishedAt,isDraft \
            | jq --arg today "$today" '[.[] | select((.isDraft | not) and (.tagName | startswith("v")) and ((.publishedAt | fromdateiso8601 + 25200 | strftime("%Y.%m.%d")) == $today))] | length')
          expected="v$today-$((count + 1))"
          if [ "$RELEASE_TAG_INPUT" != "$expected" ]; then
            echo "refusing: the release tag must be typed exactly as $expected" >&2
            exit 1
          fi
          echo "tag=$expected" >> "$GITHUB_OUTPUT"
      - name: The digest staging runs, healthy, with a passed smoke test
        id: verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          staging=$(gh api "repos/$GH_REPO/deployments?environment=staging&per_page=20" \
            | jq -c '[.[] | select(.payload.image_digest != null)] | .[0] // empty')
          [ -n "$staging" ] || { echo "refusing: staging has no recorded deployment" >&2; exit 1; }
          digest=$(printf '%s' "$staging" | jq -r '.payload.image_digest')
          id=$(printf '%s' "$staging" | jq -r '.id')
          sha=$(printf '%s' "$staging" | jq -r '.ref')
          statuses=$(gh api "repos/$GH_REPO/deployments/$id/statuses")
          echo "Staging deployment $id: $digest (from $sha)"
          printf '%s' "$statuses" | jq -r '.[] | "  \(.state): \(.description // "")"'
          # Healthy is the host's own word: makam-deploy writes
          # "<tag> (<digest>) healthy" with state success once the release is up.
          # The smoke status alone never counts.
          printf '%s' "$statuses" \
            | jq -e --arg digest "$digest" 'any(.[]; .state == "success" and ((.description // "") | endswith(" (" + $digest + ") healthy")))' > /dev/null \
            || { echo "refusing: the staging host has not reported $digest healthy" >&2; exit 1; }
          # The smoke test records its own status on the same deployment, naming
          # the digest in the description. Promotion refuses a digest without one.
          # The NEWEST smoke status for this digest decides (the API lists newest
          # first): a later failure cancels an earlier success.
          printf '%s' "$statuses" \
            | jq -e --arg digest "$digest" '[.[] | select((.description // "") | startswith("smoke test against dev.makam.co.id for " + $digest))] | .[0].state == "success"' > /dev/null \
            || { echo "refusing: $digest has no passed staging smoke test as its latest; run the \"Smoke test staging\" workflow" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  sign-and-release:
    name: Sign with the production key and create the release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sign-production
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      DIGEST: ${{ needs.check.outputs.digest }}
      RELEASE_TAG: ${{ needs.check.outputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ghcr-login
      # 1. A DRAFT first: nothing is public, and no tag exists, until the digest
      #    carries the production signature. A re-run finds the draft (or the
      #    published release) and goes on from there.
      - name: The draft release and its notes
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.check.outputs.sha }}
          REASON: ${{ inputs.reason }}
        run: |
          err=$(mktemp)
          # `gh release view` does not find a draft: look in the list (a write
          # token sees drafts), then read the notes through the API.
          if ! listed=$(gh release list --limit 200 --json tagName,isDraft 2> "$err"); then
            echo "refusing: listing the releases failed:" >&2
            cat "$err" >&2
            exit 1
          fi
          draft=$(printf '%s' "$listed" | jq -r --arg tag "$RELEASE_TAG" '[.[] | select(.tagName == $tag)] | .[0] | if . == null then "none" elif .isDraft then "true" else "false" end')
          if [ "$draft" != "none" ]; then
            if ! releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" 2> "$err"); then
              echo "refusing: reading release $RELEASE_TAG failed:" >&2
              cat "$err" >&2
              exit 1
            fi
            # A re-run signs the CURRENT staging digest, so the release it found
            # must be for that digest.
            if ! printf '%s' "$releases" | jq -e --arg tag "$RELEASE_TAG" --arg digest "$DIGEST" 'any(.[]; .tag_name == $tag and ((.body // "") | contains($digest)))' > /dev/null; then
              echo "refusing: release $RELEASE_TAG already exists and its notes do not name $DIGEST; use a new tag, or gh release delete $RELEASE_TAG if it is a leftover draft" >&2
              exit 1
            fi
            echo "Release $RELEASE_TAG already exists for $DIGEST; not creating it again"
            echo "published=$([ "$draft" = true ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only published releases are history; --notes-start-tag with no
          # previous release is an error, and the first promotion has none.
          previous=$(gh release list --limit 50 --json tagName,isDraft \
            | jq -r --arg tag "$RELEASE_TAG" '[.[] | select((.isDraft | not) and .tagName != $tag)] | .[0].tagName // empty')
          notes_args=(--generate-notes)
          if [ -n "$previous" ]; then
            notes_args+=(--notes-start-tag "$previous")
          fi
          gh release create "$RELEASE_TAG" \
            --draft \
            --target "$SHA" \
            --title "$RELEASE_TAG" \
            "${notes_args[@]}" \
            --notes "$REASON

          Production digest: \`$DIGEST\`, built from \`$SHA\`, signed with the production key."
          echo "published=false" >> "$GITHUB_OUTPUT"
          echo "Created the draft $RELEASE_TAG for $DIGEST"
      # 2. The production signature.
      - name: cosign (the production key)
        uses: ./.github/actions/cosign-sign
        with:
          image: ghcr.io/${{ github.repository }}@${{ needs.check.outputs.digest }}
          private-key: ${{ secrets.COSIGN_PROD_PRIVATE_KEY }}
          password: ${{ secrets.COSIGN_PROD_PASSWORD }}
      # 3. Publish: the tag now exists and the host may deploy the digest.
      - name: Publish the release
        if: steps.draft.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false
          echo "Published $RELEASE_TAG for $DIGEST"
          echo "The production host now deploys this digest: it is signed with the production key."
          echo "Roll back with .github/workflows/rollback.yml, or on the host:"
          echo "  /opt/makam-v1/bin/makam-deploy --env prod --digest <previous digest>"
