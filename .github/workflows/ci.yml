name: CI

# One run per push and PR. Every push and PR: check, secrets, migrations and an
# image build. A release build (main only, decided once in the `image` job's
# `release` output) also pushes sha-<commit>, runs e2e and the image scan on
# that exact image, and passes deploy-gate, which a deploy needs (ticket 72).
#
# Supply chain (ADR 0002): actions pinned by commit SHA (version in the
# comment), container images by digest, Dependabot keeps both current.

on:
  push:
  pull_request:

# A newer push cancels a superseded run, except on main: a main run may move
# the `latest` tag (deploy-gate), and cancelling a run cancels all its jobs, so
# main runs queue instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  check:
    name: Lint, typecheck, Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: makam
          POSTGRES_PASSWORD: makam
          POSTGRES_DB: makam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U makam -d makam_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Vitest migrates this empty database fresh instead of starting a test container.
      TEST_DATABASE_URL: postgres://makam:makam@localhost:5432/makam_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (production dependencies, fail on fixable critical)
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          jq -r '.vulnerabilities[] | select(.severity == "critical" and .fixAvailable != false) | "\(.name): critical, fix available"' \
            "$RUNNER_TEMP/audit.json" > "$RUNNER_TEMP/critical.txt"
          jq -r '.metadata.vulnerabilities | "npm audit --omit=dev: \(.critical) critical, \(.high) high, \(.moderate) moderate"' "$RUNNER_TEMP/audit.json"
          if [ -s "$RUNNER_TEMP/critical.txt" ]; then cat "$RUNNER_TEMP/critical.txt"; exit 1; fi
      # The real PdfRenderer test prints a page with a headless Chromium: the
      # runner's preinstalled Google Chrome (the image uses chromium-headless-shell).
      - name: Chromium for the PdfRenderer test
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --version
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The whole history, every time (small repo); accepted findings, each with
      # its reason, are in .gitleaks.toml.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git . --config .gitleaks.toml --redact --no-banner --verbose

  migrations:
    name: Migration upgrade (running release → this commit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: makam
          POSTGRES_PASSWORD: makam
          POSTGRES_DB: makam_upgrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U makam -d makam_upgrade"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # The running release: staging deploys `latest`, which only deploy-gate moves.
      RUNNING: ghcr.io/andrianm28/makam:latest
      DATABASE_URL: postgres://makam:makam@localhost:5432/makam_upgrade
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The running release
        run: |
          docker pull --quiet "$RUNNING"
          echo "Running release: $(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}} {{index .RepoDigests 0}}' "$RUNNING")"
          docker run --rm --entrypoint ls "$RUNNING" drizzle | grep '\.sql$' | sort > "$RUNNER_TEMP/released.txt"
          ls drizzle | grep '\.sql$' | sort > "$RUNNER_TEMP/here.txt"
          comm -13 "$RUNNER_TEMP/released.txt" "$RUNNER_TEMP/here.txt" | sed 's|^|drizzle/|' > "$RUNNER_TEMP/new.txt"
          echo "New migrations: $(tr '\n' ' ' < "$RUNNER_TEMP/new.txt")"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Destructive DDL in new migrations needs "-- contract:"
        run: xargs --no-run-if-empty npx tsx scripts/migrations/check-destructive-ddl.ts < "$RUNNER_TEMP/new.txt"
      - name: Migrate with the running release, then fill with representative rows
        run: |
          docker run --rm --network host -e APP_ENV=development -e DATABASE_URL "$RUNNING" node dist/migrate.mjs
          npx tsx scripts/migrations/seed-representative.ts
      - name: Chromium for the PdfRenderer test
        run: echo "CHROMIUM_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
      # Vitest's global setup migrates TEST_DATABASE_URL to this commit's
      # migrations (the upgrade), then the domain tests run on that schema.
      - name: Upgrade to this commit's migrations and run the domain tests
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm test

  image:
    name: Build image (push to ghcr on main)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    permissions:
      contents: read
      packages: write
    env:
      # The one "main only" rule: only main pushes, and so runs e2e, the scan
      # and deploy-gate. PRs and other branches build without pushing.
      RELEASE: ${{ github.ref == 'refs/heads/main' }}
    outputs:
      release: ${{ env.RELEASE }}
      # ghcr.io/andrianm28/makam:sha-<commit>@sha256:<digest>: the exact image
      # e2e, the scan and deploy-gate use.
      ref: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          # Only sha-<commit> here; `latest` (which the staging timer follows) is
          # added by deploy-gate once everything has passed.
          tags: type=sha,format=long
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.RELEASE == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E (Playwright against the pushed image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: image
    if: needs.image.outputs.release == 'true'
    permissions:
      contents: read
      packages: read
    env:
      # The staging compose file with CI's development settings (deploy/ci/e2e.env)
      # and the pushed image by digest (deploy/ci/compose.e2e.yml).
      E2E_IMAGE_REF: ${{ needs.image.outputs.ref }}
      MAKAM_TAG: sha-${{ github.sha }}
      COMPOSE: docker compose -p makam-e2e -f docker-compose.prod.yml -f deploy/ci/compose.e2e.yml --env-file deploy/ci/e2e.env
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3310
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the image (migrate first, then web and worker)
        run: |
          $COMPOSE pull --quiet
          $COMPOSE run --rm migrate
          $COMPOSE up -d --wait --wait-timeout 180
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system packages
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Playwright critical paths
        env:
          E2E_SEED_ADMIN: ${{ env.COMPOSE }} exec -T web node dist/seed-admin.mjs
          E2E_SEED_TAGIHAN: ${{ env.COMPOSE }} exec -T web node dist/seed-tagihan.mjs
          E2E_SEED_SAAT_DUKA: ${{ env.COMPOSE }} exec -T web node dist/seed-saat-duka.mjs
        run: npm run e2e
      - name: Stack logs
        if: failure()
        run: mkdir -p test-results && $COMPOSE logs --no-color --timestamps > test-results/stack.log 2>&1 || true
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: test-results/
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v

  scan:
    name: Image scan and SBOM (Trivy, fail on fixable CRITICAL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: image
    if: needs.image.outputs.release == 'true'
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.image.outputs.ref }}
      TRIVY: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the image
        run: docker pull --quiet "$IMAGE"
      - name: Cache key (one vulnerability database a day)
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-${{ steps.day.outputs.day }}
          restore-keys: trivy-
      - name: Scan and SBOM
        run: |
          mkdir -p ~/.cache/trivy trivy sbom
          trivy() {
            docker run --rm --user "$(id -u):$(id -g)" --group-add "$(stat -c %g /var/run/docker.sock)" \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v ~/.cache/trivy:/cache -v "$PWD":/work -w /work \
              "$TRIVY" image --cache-dir /cache --image-src docker --quiet "$@" "$IMAGE"
          }
          # The SBOM of the pushed image (CycloneDX).
          trivy --format cyclonedx --output sbom/sbom.cdx.json
          # Every finding, for the record (SARIF).
          # The first vulnerability scan downloads (or refreshes) the DB: a cold cache, e.g. the first run on a branch, has none.
          trivy --ignorefile .trivyignore --format sarif --output trivy/trivy.sarif
          # The gate: any CRITICAL with a fix fails the run (.trivyignore holds the accepted exceptions).
          status=0
          trivy --skip-db-update --ignorefile .trivyignore --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --format table --output trivy/critical.txt || status=$?
          {
            echo "### Trivy: fixable CRITICAL vulnerabilities in \`${IMAGE%@*}\`"
            echo '```'
            cat trivy/critical.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat trivy/critical.txt
          exit "$status"
      - name: Upload the SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
          retention-days: 90
      - name: Upload findings (SARIF)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-findings
          path: trivy/
          retention-days: 30

  # Private repo on GitHub Free: no code scanning today. Set the repo variable
  # CODE_SCANNING=true once it is enabled; only this job then gets
  # security-events: write.
  code-scanning:
    name: Findings to code scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: scan
    if: always() && vars.CODE_SCANNING == 'true' && needs.scan.result != 'skipped'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-findings
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  # The one job a deploy needs: `needs: deploy-gate` (ticket 72). It runs only
  # when every check passed on the pushed image, and hands on that exact image.
  deploy-gate:
    name: Deploy gate (all checks, e2e and scan passed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check, secrets, migrations, image, e2e, scan]
    # Moves `latest`: never cancelled mid-way, one at a time.
    concurrency:
      group: deploy-gate
      cancel-in-progress: false
    permissions:
      packages: write
    env:
      REF: ${{ needs.image.outputs.ref }}
    outputs:
      ref: ${{ needs.image.outputs.ref }}
    steps:
      - run: echo "$REF passed the checks, the secrets scan, the migration upgrade, e2e and the image scan."
      # Until ticket 72 deploys from signed images, the staging timer follows
      # `latest`: it moves only to an image that passed this gate.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Tag it latest
        run: docker buildx imagetools create --tag "${REF%%:*}:latest" "$REF"
