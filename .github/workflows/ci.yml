name: CI

# One run per commit that matters: every pull request, and every push to main.
# A branch push without a pull request deliberately runs nothing, so one commit
# is never checked twice. On main the graph also pushes sha-<commit>, runs e2e
# and the image scan on that exact image, passes deploy-gate, and then signs the
# digest (ticket 72); only a signed digest is what the staging timer follows.
#
# Supply chain (ADR 0002): actions pinned by commit SHA (version in the
# comment), container images by digest, Dependabot keeps both current.

on:
  push:
    branches: [main]
  pull_request:

# GitHub keeps only one *pending* run per group: a new push cancels the pending
# one, so a run in the middle is skipped. Off main nothing was deployed, so that
# costs nothing. On main a run may sign the image and move `latest`, and those
# runs are never cancelled: each one waits its turn in the `sign` group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  check:
    name: Lint, typecheck, Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: makam
          POSTGRES_PASSWORD: makam
          POSTGRES_DB: makam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U makam -d makam_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Vitest migrates this empty database fresh instead of starting a test container.
      TEST_DATABASE_URL: postgres://makam:makam@localhost:5432/makam_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (production dependencies, fail on fixable critical)
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          jq -r '.vulnerabilities[] | select(.severity == "critical" and .fixAvailable != false) | "\(.name): critical, fix available"' \
            "$RUNNER_TEMP/audit.json" > "$RUNNER_TEMP/critical.txt"
          jq -r '.metadata.vulnerabilities | "npm audit --omit=dev: \(.critical) critical, \(.high) high, \(.moderate) moderate"' "$RUNNER_TEMP/audit.json"
          if [ -s "$RUNNER_TEMP/critical.txt" ]; then cat "$RUNNER_TEMP/critical.txt"; exit 1; fi
      # The real PdfRenderer test prints a page with a headless Chromium: the
      # runner's preinstalled Google Chrome (the image uses chromium-headless-shell).
      - uses: ./.github/actions/chromium
      - run: npm run lint
      - run: npm run typecheck
      # Test-tuned Postgres (ticket 104): a throwaway service container, so it
      # may skip durability. Reloadable settings, so no restart. This is CI's
      # test service only; staging and production Postgres are never tuned.
      - name: Tune the test Postgres (no fsync)
        run: |
          for setting in fsync synchronous_commit full_page_writes; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter system set $setting = off"
          done
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "select pg_reload_conf()"
      - run: npm test

  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The whole history, every time (small repo); accepted findings, each with
      # its reason, are in .gitleaks.toml.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git . --config .gitleaks.toml --redact --no-banner --verbose

  # Every workflow is linted (expressions, shellcheck on run scripts) so a typo
  # in a promotion workflow fails here and not on the night it is needed. The
  # image is pinned by digest (rhysd/actionlint 1.7.12).
  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color .github/workflows/*.yml

  migrations:
    name: Migration upgrade (running release → this commit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: makam
          POSTGRES_PASSWORD: makam
          POSTGRES_DB: makam_upgrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U makam -d makam_upgrade"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # The running release, filled in below: production lags staging, so the
      # upgrade starts from the digest production actually runs, then staging,
      # and only then the ghcr `latest` tag. A host that never deployed has no
      # baseline, and an empty database is then the honest starting point.
      RUNNING: ghcr.io/${{ github.repository }}:latest
      DATABASE_URL: postgres://makam:makam@localhost:5432/makam_upgrade
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node and the dependencies before anything runs this repository's own
      # script: `npx --no-install` then uses the tsx from node_modules instead of
      # fetching one from the registry.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/ghcr-login
      - name: The running release (production, else staging, else latest)
        run: |
          baseline=""
          for environment in production staging; do
            # Only deployments that succeeded, newest first: the newest
            # deployment of an environment is often a refused or rolled-back
            # attempt, and that image is not what the host is running.
            deployments=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=$environment&per_page=20" \
              --jq '.[] | select(.state == "success") | @json' 2>/dev/null || true)
            while IFS= read -r deployment; do
              [ -n "$deployment" ] || continue
              candidate=$(printf '%s' "$deployment" | npx --no-install tsx scripts/migrations/deployed-release.ts "$GITHUB_REPOSITORY" 2>/dev/null || true)
              if [ -n "$candidate" ]; then baseline="$candidate"; break; fi
            done <<< "$deployments"
            [ -n "$baseline" ] && { echo "Running release ($environment): $baseline"; break; }
          done
          [ -n "$baseline" ] && echo "RUNNING=$baseline" >> "$GITHUB_ENV"
          docker pull --quiet "$RUNNING"
          echo "Upgrading from: $RUNNING"
          docker run --rm --entrypoint ls "$RUNNING" drizzle | grep '\.sql$' | sort > "$RUNNER_TEMP/released.txt"
          find drizzle -maxdepth 1 -name '*.sql' -printf '%f\n' | sort > "$RUNNER_TEMP/here.txt"
          comm -13 "$RUNNER_TEMP/released.txt" "$RUNNER_TEMP/here.txt" | sed 's|^|drizzle/|' > "$RUNNER_TEMP/new.txt"
          echo "New migrations: $(tr '\n' ' ' < "$RUNNER_TEMP/new.txt")"
      - name: Destructive DDL in new migrations needs "-- contract:"
        run: xargs --no-run-if-empty npx tsx scripts/migrations/check-destructive-ddl.ts < "$RUNNER_TEMP/new.txt"
      - name: Migrate with the running release, then fill with representative rows
        run: |
          docker run --rm --network host -e APP_ENV=development -e DATABASE_URL "$RUNNING" node dist/migrate.mjs
          npx tsx scripts/migrations/seed-representative.ts
      - uses: ./.github/actions/chromium
      # Test-tuned like `check`'s service (ticket 104): throwaway, CI only.
      - name: Tune the test Postgres (no fsync)
        run: |
          for setting in fsync synchronous_commit full_page_writes; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter system set $setting = off"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select pg_reload_conf()"
      # Vitest's global setup migrates TEST_DATABASE_URL to this commit's
      # migrations (the upgrade), then the domain tests run on that schema.
      - name: Upgrade to this commit's migrations and run the domain tests
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm test

  image:
    name: Build image (push to ghcr on main)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No `needs: check` (ticket 104): the image builds while the tests run, and
    # every deploy and sign path still waits for `check`: e2e, scan and
    # sourcemaps follow this job, deploy-gate lists `check` itself, and sign
    # needs deploy-gate. Cost of the trade: an image for a commit whose tests
    # fail is built (and pushed on main as sha-<commit>, which nothing deploys
    # until sign moves `latest`).
    permissions:
      contents: read
      packages: write
    env:
      # The one "main only" rule: only main pushes, and so runs e2e, the scan
      # and deploy-gate. PRs and other branches build without pushing.
      RELEASE: ${{ github.ref == 'refs/heads/main' }}
    outputs:
      release: ${{ env.RELEASE }}
      # ghcr.io/andrianm28/makam:sha-<commit>@sha256:<digest>: the exact image
      # e2e, the scan and deploy-gate use.
      ref: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "Repository: $GITHUB_REPOSITORY"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          # Only sha-<commit> here; `latest` (which the staging timer follows) is
          # added by sign, once the signature exists.
          tags: type=sha,format=long
      - uses: ./.github/actions/ghcr-login
        if: env.RELEASE == 'true'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            # The release is a build-time fact (the commit), not a secret: the
            # SDK injects it into the bundle, and the same value is the release
            # the `sourcemaps` job uploads under. Nothing environment-specific
            # goes in here; the browser DSN stays a runtime value.
            SENTRY_RELEASE=${{ github.sha }}

  e2e:
    name: E2E (Playwright against the pushed image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: image
    if: needs.image.outputs.release == 'true'
    permissions:
      contents: read
      packages: read
    env:
      # The staging compose file with CI's development settings (deploy/ci/e2e.env)
      # and the pushed image by digest (deploy/ci/compose.e2e.yml).
      E2E_IMAGE_REF: ${{ needs.image.outputs.ref }}
      MAKAM_TAG: sha-${{ github.sha }}
      COMPOSE: docker compose -p makam-e2e -f docker-compose.prod.yml -f deploy/ci/compose.e2e.yml --env-file deploy/ci/e2e.env
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3310
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ghcr-login
      - name: Start the image (migrate first, then web and worker)
        run: |
          $COMPOSE pull --quiet
          $COMPOSE run --rm migrate
          $COMPOSE up -d --wait --wait-timeout 180
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system packages
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Playwright critical paths
        env:
          E2E_SEED_ADMIN: ${{ env.COMPOSE }} exec -T web node dist/seed-admin.mjs
          E2E_SEED_TAGIHAN: ${{ env.COMPOSE }} exec -T web node dist/seed-tagihan.mjs
          E2E_SEED_SAAT_DUKA: ${{ env.COMPOSE }} exec -T web node dist/seed-saat-duka.mjs
        # The @smoke specs are the hosted staging gate, not part of this job.
        run: npm run e2e -- --grep-invert @smoke
      - name: Stack logs
        if: failure()
        run: mkdir -p test-results && $COMPOSE logs --no-color --timestamps > test-results/stack.log 2>&1 || true
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: test-results/
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v

  scan:
    name: Image scan and SBOM (Trivy, fail on fixable CRITICAL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: image
    if: needs.image.outputs.release == 'true'
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.image.outputs.ref }}
      TRIVY: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ghcr-login
      - name: Pull the image
        run: docker pull --quiet "$IMAGE"
      - name: Cache key (one vulnerability database a day)
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-${{ steps.day.outputs.day }}
          restore-keys: trivy-
      - name: Scan and SBOM
        run: |
          mkdir -p ~/.cache/trivy trivy sbom
          trivy() {
            docker run --rm --user "$(id -u):$(id -g)" --group-add "$(stat -c %g /var/run/docker.sock)" \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v ~/.cache/trivy:/cache -v "$PWD":/work -w /work \
              "$TRIVY" image --cache-dir /cache --image-src docker --quiet "$@" "$IMAGE"
          }
          # The SBOM of the pushed image (CycloneDX).
          trivy --format cyclonedx --output sbom/sbom.cdx.json
          # Every finding, for the record (SARIF).
          # The first vulnerability scan downloads (or refreshes) the DB: a cold cache, e.g. the first run on a branch, has none.
          trivy --ignorefile .trivyignore --format sarif --output trivy/trivy.sarif
          # The gate: any CRITICAL with a fix fails the run (.trivyignore holds the accepted exceptions).
          status=0
          trivy --skip-db-update --ignorefile .trivyignore --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --format table --output trivy/critical.txt || status=$?
          {
            echo "### Trivy: fixable CRITICAL vulnerabilities in \`${IMAGE%@*}\`"
            echo '```'
            cat trivy/critical.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat trivy/critical.txt
          exit "$status"
      - name: Upload the SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
          retention-days: 90
      - name: Upload findings (SARIF)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-findings
          path: trivy/
          retention-days: 30

  # Private repo on GitHub Free: no code scanning today. Set the repo variable
  # CODE_SCANNING=true once it is enabled; only this job then gets
  # security-events: write.
  code-scanning:
    name: Findings to code scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: scan
    if: always() && vars.CODE_SCANNING == 'true' && needs.scan.result != 'skipped'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-findings
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  # Source maps to GlitchTip for this exact image (ticket 72, ADR 0002). It
  # uploads from the pushed image, with the token as a GitHub secret, so no
  # build and no image layer ever holds it. deploy-gate does not need this job:
  # missing source maps cost readable stack traces, not a deploy.
  sourcemaps:
    name: Source maps to GlitchTip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: image
    if: needs.image.outputs.release == 'true'
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.image.outputs.ref }}
      # The same value as the SENTRY_RELEASE build argument above: a release and
      # its source maps are one thing, under one name.
      RELEASE: ${{ github.sha }}
      SENTRY_URL: ${{ vars.GLITCHTIP_URL }}
      SENTRY_ORG: ${{ vars.GLITCHTIP_ORG }}
      SENTRY_PROJECT: ${{ vars.GLITCHTIP_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
      # Pinned by digest like every other image here (Dependabot cannot see a
      # docker run in a workflow, so this one is a manual bump, as cosign is).
      SENTRY_CLI: ghcr.io/getsentry/sentry-cli:2.46.0@sha256:03db524ab5066f720a66aaeae46820e41fbcf4a6c0f60d326c81cb59aa0df6ee
    steps:
      # A **local** composite action is read out of the checked-out repository,
      # so this job needs the tree before it. Without it the job dies in 0
      # seconds with "Can't find 'action.yml' ... Did you forget to run
      # actions/checkout before running your local action?" — which reads like
      # a missing secret and is not one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ghcr-login
      - name: Upload the source maps of that image
        run: scripts/ci/upload-sourcemaps.sh

  # The gate every deploy waits for: it runs only when every check passed on the
  # pushed image, and hands on that exact image. It no longer moves `latest`:
  # that happens in `sign`, after the signature exists, so the staging timer can
  # never pick up an unsigned digest.
  deploy-gate:
    name: Deploy gate (all checks, e2e and scan passed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check, secrets, actionlint, migrations, image, e2e, scan]
    permissions: {}
    env:
      REF: ${{ needs.image.outputs.ref }}
    outputs:
      ref: ${{ needs.image.outputs.ref }}
    steps:
      - run: echo "$REF passed the checks, the secrets scan, the migration upgrade, e2e and the image scan."

  # Sign, then point the staging timer at the signed digest. `latest` is only a
  # pointer for the host: makam-deploy resolves it to a digest and refuses
  # anything the staging key did not sign (deploy/bin/makam-verify-image).
  # Never cancelled mid-way, one at a time.
  sign:
    name: Sign the image (cosign, staging key) and move latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-gate]
    concurrency:
      group: sign
      cancel-in-progress: false
    permissions:
      # packages: write is the signature and the retag; nothing else.
      packages: write
    env:
      REF: ${{ needs.deploy-gate.outputs.ref }}
    outputs:
      ref: ${{ needs.deploy-gate.outputs.ref }}
      digest: ${{ steps.parts.outputs.digest }}
    steps:
      # Both of this job's steps below are **local** composite actions
      # (`.github/actions/ghcr-login` and `.github/actions/cosign-sign`), and a
      # local action is read out of the checked-out repository. Without this step
      # the runner has no tree, so the first one dies in 0 seconds with
      # "Can't find 'action.yml' ... Did you forget to run actions/checkout before
      # running your local action?" — which reads like a missing secret and is
      # not one. Same pin as the rest of this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ghcr-login
      - name: The signed digest
        id: parts
        run: echo "digest=${REF##*@}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The staging private key is a GitHub secret; the matching public key is on
      # the host (deploy/install-host.sh). Production has its own pair, used only
      # by the promotion and rollback workflows. The image is pinned by digest in
      # the action, because that container reads a private key.
      - name: cosign
        uses: ./.github/actions/cosign-sign
        with:
          image: ${{ needs.deploy-gate.outputs.ref }}
          private-key: ${{ secrets.COSIGN_STAGING_PRIVATE_KEY }}
          password: ${{ secrets.COSIGN_STAGING_PASSWORD }}
      # Only now does the host have something signed to follow.
      - name: Tag it latest
        run: docker buildx imagetools create --tag "${REF%%:*}:latest" "$REF"
