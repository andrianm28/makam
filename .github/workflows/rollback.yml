name: Roll back production

# Owner-only rollback to an earlier released digest (ticket 72; made right for
# its first run in ticket 106). It re-signs that digest with the production key,
# because the production host accepts only production-signed images, and it
# deliberately creates no new release: the release list stays the history of
# what went out, and the rollback is recorded as a deployment instead.
#
# The by-hand path is in the runbook ("Rolling back") and is the same command
# this workflow ends with:
#   /opt/makam-v1/bin/makam-deploy --env prod --digest sha256:...
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "An earlier release tag to go back to, e.g. v2026.09.27-1"
        required: true
        type: string
      reason:
        description: "Why (goes into the deployment status, not a new release)"
        required: true
        type: string

permissions: {}

# `bash -eo pipefail` for every script (a step with no `shell:` runs `bash -e`,
# where a failing gh at the head of a pipe goes unnoticed).
defaults:
  run:
    shell: bash

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  rollback:
    name: Re-sign an earlier digest for production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      packages: write
    steps:
      - name: Only the repository owner may roll back
        if: github.actor != github.repository_owner
        run: |
          echo "refusing: $GITHUB_ACTOR is not the owner of $GITHUB_REPOSITORY" >&2
          exit 1
      # This step runs before the checkout, so gh has no git remote: GH_REPO is
      # what tells it the repository. The owner's inputs reach the script
      # through env, never pasted into its text.
      - name: The release exists, and the digest it went out as
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          refuse() { echo "refusing: $*" >&2; exit 1; }
          # gh's own message is kept: only "release not found" means there is no
          # such release. A missing repository, a bad token or an outage is
          # something else, and reading it as "no such release" sends the owner
          # looking at the wrong thing.
          error="$RUNNER_TEMP/gh-release-view.err"
          release=$(gh release view "$RELEASE_TAG" --json tagName,targetCommitish,isDraft 2> "$error") || {
            if grep -qi 'release not found' "$error"; then
              refuse "there is no release $RELEASE_TAG"
            fi
            refuse "could not look up the release $RELEASE_TAG: $(cat "$error")"
          }
          [ "$(jq -r '.isDraft' <<< "$release")" = false ] \
            || refuse "$RELEASE_TAG is a draft: it never went out, so there is nothing to go back to"
          sha=$(jq -r '.targetCommitish' <<< "$release")
          # The payload is an object when the host wrote it, and a JSON string when a
          # Deployment was made with `gh api -F payload=...`.
          digest=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=50" \
            | jq -r --arg sha "$sha" 'def digest: (.payload | if type == "string" then (try fromjson catch null) else . end) | objects | .image_digest;
                                      [.[] | select(.ref == $sha) | digest | select(. != null)] | .[0] // empty')
          [ -n "$digest" ] || refuse "no production deployment records a digest for $sha, so this release never reached production"
          {
            echo "tag=$RELEASE_TAG"
            echo "sha=$sha"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
          echo "Rolling back to $RELEASE_TAG ($digest, from $sha)"
      # A **local** composite action is read out of the checked-out repository,
      # so this job needs the tree before it. Without it the job dies in 0
      # seconds with "Can't find 'action.yml' ... Did you forget to run
      # actions/checkout before running your local action?" — which reads like
      # a missing secret and is not one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ghcr-login
      - name: cosign (the production key, again)
        uses: ./.github/actions/cosign-sign
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.release.outputs.digest }}
          private-key: ${{ secrets.COSIGN_PROD_PRIVATE_KEY }}
          password: ${{ secrets.COSIGN_PROD_PASSWORD }}
      - name: Record the rollback as a production deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REASON: ${{ inputs.reason }}
          DIGEST: ${{ steps.release.outputs.digest }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          # A JSON body, so that `required_contexts` can be the empty list (the
          # host's own Deployments send it too: without it GitHub refuses a
          # Deployment at a commit whose checks are not all green) and the
          # payload is an object, which is what every reader of the digest expects.
          deployment=$(jq -n --arg sha "$SHA" --arg digest "$DIGEST" --arg tag "$RELEASE_TAG" \
            '{ref: $sha, environment: "production", auto_merge: false, required_contexts: [],
              payload: {image_digest: $digest}, description: ("Rollback to " + $tag)}')
          id=$(printf '%s' "$deployment" | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')
          # GitHub keeps a status description to 140 characters, and a digest
          # alone is 71 of them: the status is cut there and the whole reason
          # goes into the job summary below.
          status=$(jq -n --arg full "rolling back to $RELEASE_TAG ($DIGEST): $REASON" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: "in_progress", environment: "production", log_url: $url, description: $full[0:140]}')
          printf '%s' "$status" | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --input - > /dev/null
          {
            echo "## Rolling back production to \`$RELEASE_TAG\`"
            echo
            echo "Reason: $REASON"
            echo
            echo "The digest \`$DIGEST\` is signed with the production key again. Deploy it on the host:"
            echo
            echo '```bash'
            echo "/opt/makam-v1/bin/makam-deploy --env prod --digest $DIGEST"
            echo '```'
            echo
            echo "Migrations are forward-only: this works only while that image tolerates the current schema."
          } >> "$GITHUB_STEP_SUMMARY"
