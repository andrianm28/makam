name: Chromium for the PdfRenderer test
description: >-
  Puts a headless Chromium on PATH for the PdfRenderer test. The real test
  prints a page, and the image uses chromium-headless-shell; a hosted runner
  ships Google Chrome, which works just as well. Shared by every job that runs
  Vitest, so the `--version` check exists once.

runs:
  using: composite
  steps:
    - name: Chromium for the PdfRenderer test
      shell: bash
      run: |
        CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
        "$CHROME" --version
        echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
