name: Sign an image with cosign
description: >-
  Signs one image reference with a cosign key pair, and refuses without the
  private key: an image with no signature is not deployable, so "no key" must
  fail the run rather than pass an unsigned digest on (the host refuses those
  too, with exit 77). The key never leaves GitHub: the caller passes it from a
  repository secret, and the key is handed to the signing container as an
  environment variable rather than a file, so it never touches the runner's
  disk. Staging and production have separate pairs, so an image signed for
  one is not accepted on the other. Shared by ci.yml, promote.yml and
  rollback.yml, so the image is pinned by digest in exactly one place. Only a
  digest is accepted, never a tag.

inputs:
  image:
    description: "The image reference to sign, tag or tag@digest or repo@digest"
    required: true
  private-key:
    description: "The cosign private key (PEM), from a repository secret"
    required: true
  password:
    description: "The key's password, empty when it has none"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: cosign sign
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        COSIGN_PRIVATE_KEY: ${{ inputs.private-key }}
        COSIGN_PASSWORD: ${{ inputs.password }}
        # Pinned by digest, like every other image here: this container reads a
        # cosign *private key*, so a tag that could be moved is a hole. Dependabot
        # cannot see an image used only in a workflow, so this is a manual bump.
        COSIGN: ghcr.io/sigstore/cosign/cosign:v2.6.1@sha256:68839b7f13dac5a6744a5d8818e984dd39183374e37855c19e14d623d9bc9037
      run: |
        if [ -z "$COSIGN_PRIVATE_KEY" ]; then
          echo "refusing to sign $IMAGE: the private-key input is empty (the caller passes it from a repository secret)" >&2
          exit 1
        fi
        # Only a digest may be signed. A tag resolves to whatever it points at at
        # this moment, so signing one and pulling it later is the window this
        # whole design exists to close. Every caller passes a digest today; this
        # is what stops a future caller from passing a tag and breaking that
        # without noticing.
        case "$IMAGE" in
          *@sha256:*) ;;
          *)
            echo "refusing to sign $IMAGE: it is not pinned by digest, and a tag can move between signing and the host's pull" >&2
            exit 1
            ;;
        esac
        # The key goes into the container as an environment variable, not as a
        # file. cosign reads COSIGN_PRIVATE_KEY and COSIGN_PASSWORD from the
        # environment, and a file was wrong three times over, all one cause: the
        # cosign container runs as uid 65532 and the runner writes 0600. The key
        # was unreadable (permission denied); the passphrase was only ever
        # written to cosign.password, which cosign never reads; and the
        # registry credentials are still 0600 today, which is what actually
        # stopped this job — cosign fell back to an anonymous pull and ghcr
        # answered UNAUTHORIZED, forty runs in a row with nothing to read.
        #
        # So the credentials get the same treatment as the key, in a scratch
        # copy the container can read, leaving the runner's own file at 0600 and
        # nothing behind on a failure. DOCKER_CONFIG is set rather than relying
        # on the image's home directory, so the mount path is not a guess.
        DOCKER_SCRATCH="$RUNNER_TEMP/cosign-docker-config"
        rm -rf "$DOCKER_SCRATCH"
        install -d -m 0755 "$DOCKER_SCRATCH"
        install -m 0644 "${DOCKER_CONFIG:-$HOME/.docker}/config.json" "$DOCKER_SCRATCH/config.json"

        docker run --rm \
          -e COSIGN_PRIVATE_KEY \
          -e COSIGN_PASSWORD \
          -e DOCKER_CONFIG=/docker \
          -v "$DOCKER_SCRATCH:/docker:ro" \
          --entrypoint cosign "$COSIGN" sign --yes \
          "$IMAGE"

        rm -rf "$DOCKER_SCRATCH"
