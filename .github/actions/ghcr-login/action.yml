name: Log in to ghcr
description: >-
  Logs the runner in to ghcr.io with the workflow token. What it may do is the
  job's own `permissions` block, never this step, so least privilege stays in
  one place. The image name is never spelled out in a job: it comes from
  GITHUB_REPOSITORY, so a fork or a rename needs no edit.

runs:
  using: composite
  steps:
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        # `github.token`, not `secrets.GITHUB_TOKEN`: a composite action is
        # validated as its own manifest, and the `secrets` context is not a
        # recognised named-value there, so GitHub refused to load the action at
        # all and every job that logs in to ghcr failed in 0s. The `github`
        # context is available, and `github.token` is the same workflow token
        # that `secrets.GITHUB_TOKEN` names (GitHub: "An action can access the
        # GITHUB_TOKEN through the `github.token` context even if the workflow
        # does not explicitly pass the GITHUB_TOKEN to the action"). What it may
        # do is still only this job's `permissions` block, so least privilege
        # stays where the description says it does.
        password: ${{ github.token }}
